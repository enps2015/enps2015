<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="165" viewBox="0 0 495 165" role="img" aria-labelledby="t d">
  <title id="t">Cartão de linguagens dos repositórios públicos — aguardando primeira geração</title>
  <desc id="d">Cartão de estado inicial. O workflow irá gerar um resumo com as linguagens detectadas nos repositórios públicos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#101B2B"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="164" rx="12" fill="url(#bg)" stroke="#263A4E"/>
  <rect x="18" y="18" width="4" height="16" rx="2" fill="#2DD4BF"/>
  <text x="32" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Language Map</text>
  <text x="476" y="29" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing=".6" fill="#6F879A">PUBLIC REPOSITORIES</text>
  <path d="M18 50H477" stroke="#263A4E"/>
  <g transform="translate(26 66)">
