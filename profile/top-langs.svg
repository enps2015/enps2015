  <text x="26" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#DCE7F0">Linguagens detectadas automaticamente</text>
  <text x="26" y="129" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#8FA7BA">O gráfico será preenchido com os dados reais na primeira execução.</text>
  <path d="M18 143H477" stroke="#263A4E"/>
  <text x="20" y="156" font-family="ui-monospace,Consolas,monospace" font-size="8.5" letter-spacing=".4" fill="#6F879A">LINGUAGENS ≠ NÍVEL DE PROFICIÊNCIA</text>
