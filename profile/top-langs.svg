    <text x="126" y="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#B2F5E7">SQL</text>
    <text x="194" y="13" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#D8D0FF">JS / TS</text>
