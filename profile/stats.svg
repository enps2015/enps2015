<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="165" viewBox="0 0 495 165" role="img" aria-labelledby="t d">
  <title id="t">Cartão de estatísticas do GitHub — aguardando primeira geração</title>
  <desc id="d">Cartão de estado inicial. Um workflow do GitHub Actions substituirá este SVG por estatísticas públicas atualizadas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#101B2B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.08"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="164" rx="12" fill="url(#bg)" stroke="#263A4E"/>
  <rect x="1" y="1" width="493" height="163" rx="12" fill="url(#glow)"/>
  <rect x="18" y="18" width="4" height="16" rx="2" fill="#67E8F9"/>
  <text x="32" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">GitHub Snapshot</text>
  <rect x="349" y="17" width="127" height="22" rx="11" fill="#12342F" stroke="#2DD4BF" stroke-opacity=".55"/>
  <circle cx="362" cy="28" r="3" fill="#2DD4BF"/>
  <text x="372" y="32" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6" fill="#A7F3D0">AUTO-UPDATED</text>
  <path d="M18 50H477" stroke="#263A4E"/>
  <g transform="translate(24 67)">
    <circle cx="14" cy="14" r="14" fill="#12304A" stroke="#67E8F9" stroke-opacity=".5"/>
    <path d="M7 15l5 5 10-12" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#DCE7F0">Painel de métricas preparado</text>
    <text x="42" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#8FA7BA">O GitHub Actions gerará o primeiro snapshot após a ativação.</text>
  </g>
  <path d="M18 126H477" stroke="#263A4E"/>
  <text x="20" y="147" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing=".7" fill="#6F879A">SOURCE: GITHUB PUBLIC ACTIVITY</text>
  <text x="475" y="147" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing=".7" fill="#6F879A">ENPS2015 / PROFILE</text>
</svg>