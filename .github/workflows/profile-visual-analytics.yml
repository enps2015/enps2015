name: Generate visual GitHub analytics
on:
  workflow_dispatch:
  schedule:
    - cron: "31 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-visual-analytics.yml"
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution calendar and activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: enps2015
          template: classic
          base: ""
          config_timezone: America/Belem
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          filename: profile/metrics-overview.svg
      - name: Language analytics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: enps2015
          template: classic
          base: ""
          config_timezone: America/Belem
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15
          filename: profile/metrics-languages.svg
