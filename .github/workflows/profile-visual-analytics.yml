name: Atualizar analytics visuais do perfil

on:
  schedule:
    # 07:35 no horário de Belém (UTC-3).
    - cron: "35 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-visual-analytics.yml"
      - "scripts/generate_profile_analytics.py"

permissions:
  contents: write

concurrency:
  group: profile-visual-analytics
  cancel-in-progress: false

jobs:
  generate:
    name: Gerar painel analítico em português
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do perfil
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Consultar a API pública do GitHub e gerar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_analytics.py

      - name: Publicar painel atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics-overview.svg
          if git diff --cached --quiet; then
            echo "Painel já está atualizado."
            exit 0
          fi
          git commit -m "chore(profile): refresh public GitHub analytics"
          git pull --rebase origin main
          git push origin main
