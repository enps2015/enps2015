name: Atualizar animação de contribuições

on:
  # Primeiro processamento quando a configuração chega à main.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-snake.yml"
  # Atualização diária às 07:17 no horário de Belém (UTC-3).
  schedule:
    - cron: "17 10 * * *"
  # Permite gerar os arquivos manualmente.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Gerar e publicar SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar animação da grade de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: enps2015
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar os SVGs no branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
