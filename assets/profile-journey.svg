      <g fill="none" stroke="#DDD6FE" stroke-width="1.5"><circle cx="0" cy="0" r="5"/><circle cx="-10" cy="-7" r="3"/><circle cx="11" cy="-8" r="3"/><circle cx="-10" cy="9" r="3"/><circle cx="10" cy="9" r="3"/><path d="M-5-3L-8-5M5-3L9-6M-5 3L-8 7M5 3L8 7"/></g>
      <text y="55" font-size="10" font-weight="800" letter-spacing="1.2" fill="#DDD6FE">05 · AMPLIAÇÃO</text>
      <text y="78" font-size="15" font-weight="800" fill="#F3F8FC">Sistemas humanos</text>
      <text y="99" font-size="12" fill="#AFC4D2">IoT · agentes · cognição</text>
    </g>
  </g>
  <text x="38" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#9DB5C5">Da operação à análise; da análise à inteligência; da inteligência a experiências que as pessoas conseguem usar.</text>
