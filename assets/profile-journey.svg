      <circle r="24" fill="#102D36" stroke="#2DD4BF" stroke-width="2"/>
      <circle r="14" fill="none" stroke="#2DD4BF" stroke-opacity=".65"/>
      <path d="M-9 0h18M0-9v18M-6-6l12 12M6-6L-6 6" stroke="#99F6E4" stroke-width="1.3" stroke-linecap="round"/>
      <text y="55" font-size="10" font-weight="800" letter-spacing="1.2" fill="#99F6E4">01 · BASE</text>
      <text y="78" font-size="15" font-weight="800" fill="#F3F8FC">Engenharia</text>
      <text y="99" font-size="12" fill="#AFC4D2">Elétrica · sistemas</text>
    </g>
    <g transform="translate(350 135)">
      <circle r="24" fill="#102B3C" stroke="#4DD4DF" stroke-width="2"/>
      <path d="M-11 1C-6-8-1-8 4 1S14 10 12 0" fill="none" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round"/>
      <path d="M-12 9H12" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
      <text y="55" font-size="10" font-weight="800" letter-spacing="1.2" fill="#A5F3FC">02 · REALIDADE</text>
      <text y="78" font-size="15" font-weight="800" fill="#F3F8FC">Saneamento</text>
      <text y="99" font-size="12" fill="#AFC4D2">Operação · Belém</text>
    </g>
    <g transform="translate(600 135)">
      <circle r="24" fill="#10293E" stroke="#67E8F9" stroke-width="2"/>
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke="#CFFAFE" stroke-width="1.6"/>
      <path d="M-5-4H5M-5 0H5M-5 4H2" stroke="#CFFAFE" stroke-width="1.6" stroke-linecap="round"/>
      <text y="55" font-size="10" font-weight="800" letter-spacing="1.2" fill="#CFFAFE">03 · CONSTRUÇÃO</text>
      <text y="78" font-size="15" font-weight="800" fill="#F3F8FC">Software &amp; DevOps</text>
      <text y="99" font-size="12" fill="#AFC4D2">ADS · automação</text>
    </g>
    <g transform="translate(850 135)">
      <circle r="24" fill="#18283E" stroke="#8CB7FA" stroke-width="2"/>
      <g fill="none" stroke="#BFDBFE" stroke-width="1.6"><path d="M-10 9V-5L0-11 10-5V9L0 14Z"/><path d="M-10-5L0 1 10-5M0 1V14"/></g>
      <text y="55" font-size="10" font-weight="800" letter-spacing="1.2" fill="#BFDBFE">04 · INVESTIGAÇÃO</text>
      <text y="78" font-size="15" font-weight="800" fill="#F3F8FC">Dados &amp; IA</text>
      <text y="99" font-size="12" fill="#AFC4D2">Ciência · território</text>
    </g>
    <g transform="translate(1100 135)">
