<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">A trajetória de Eric Pimentel: da engenharia à tecnologia centrada nas pessoas</title>
  <desc id="desc">Linha evolutiva que conecta engenharia elétrica, saneamento e operação, software e DevOps, ciência de dados e IA, sistemas inteligentes e cognição humana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset=".55" stop-color="#0C1D2E"/><stop offset="1" stop-color="#17162D"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2DD4BF"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#31516A" stroke-width=".7" opacity=".34"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <text x="38" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#67E8F9">TRAJETÓRIA · SISTEMAS · DADOS · PESSOAS</text>
  <text x="38" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#F3F8FC">Uma mesma curiosidade, aplicada em escalas diferentes.</text>
  <path d="M100 135H1100" stroke="#244256" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 135H1100" stroke="url(#track)" stroke-width="2.4" stroke-linecap="round"/>
