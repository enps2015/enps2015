<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Constelação de formação de Eric Pimentel</title>
  <desc id="desc">Quatro eixos conectados de aprendizagem: dados e território, gêmeos digitais e 5G, agentes inteligentes e cognição humana. Destaca o décimo lugar no ranking do curso TIC51 e a indicação para a residência tecnológica UniFacens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset=".58" stop-color="#0C1D2E"/><stop offset="1" stop-color="#17162D"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2DD4BF"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#31516A" stroke-width=".7" opacity=".32"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <text x="34" y="38" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">FORMAÇÃO EM MOVIMENTO</text>
  <text x="34" y="67" fill="#F2F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Quatro linhas de estudo. Um mesmo objetivo: construir sistemas mais inteligentes.</text>
