<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Smart Hydrometer data pipeline</title><desc id="desc">Conceptual pipeline from simulated meter telemetry through data validation and processing to analytics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#12243a"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<rect width="900" height="330" rx="22" fill="url(#bg)"/><circle cx="760" cy="30" r="120" fill="#22d3ee" opacity=".06"/>
<g font-family="Arial,sans-serif"><text x="38" y="42" fill="#67e8f9" font-size="12" font-weight="700" letter-spacing="3">SMART WATER · DATA ENGINEERING</text><text x="38" y="76" fill="#f1f5f9" font-size="25" font-weight="700">From telemetry to insight</text>
<g><rect x="38" y="115" width="190" height="130" rx="14" fill="#122c42" stroke="#256477"/><text x="57" y="151" fill="#67e8f9" font-size="12">01 / INPUT</text><text x="57" y="183" fill="#f8fafc" font-size="18" font-weight="700">Simulate</text><text x="57" y="210" fill="#a8c2d4" font-size="12">Meter events</text><text x="57" y="228" fill="#a8c2d4" font-size="12">Time-series records</text></g>
<g><rect x="258" y="115" width="190" height="130" rx="14" fill="#122c42" stroke="#256477"/><text x="277" y="151" fill="#67e8f9" font-size="12">02 / QUALITY</text><text x="277" y="183" fill="#f8fafc" font-size="18" font-weight="700">Validate</text><text x="277" y="210" fill="#a8c2d4" font-size="12">Schema & integrity</text><text x="277" y="228" fill="#a8c2d4" font-size="12">Missing / invalid data</text></g>
<g><rect x="478" y="115" width="190" height="130" rx="14" fill="#122c42" stroke="#256477"/><text x="497" y="151" fill="#67e8f9" font-size="12">03 / PIPELINE</text><text x="497" y="183" fill="#f8fafc" font-size="18" font-weight="700">Process</text><text x="497" y="210" fill="#a8c2d4" font-size="12">ETL & partitioning</text><text x="497" y="228" fill="#a8c2d4" font-size="12">Time-series features</text></g>
<g><rect x="698" y="115" width="164" height="130" rx="14" fill="#12372f" stroke="#2dd4bf"/><text x="717" y="151" fill="#99f6e4" font-size="12">04 / INSIGHT</text><text x="717" y="183" fill="#f8fafc" font-size="18" font-weight="700">Analyze</text><text x="717" y="210" fill="#b7e5d8" font-size="12">Anomaly signals</text><text x="717" y="228" fill="#b7e5d8" font-size="12">Operational insight</text></g>
<g stroke="url(#a)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M230 180h22m-7-7 7 7-7 7"/><path d="M450 180h22m-7-7 7 7-7 7"/><path d="M670 180h22m-7-7 7 7-7 7"/></g>
<text x="38" y="285" fill="#a8c2d4" font-size="12">Conceptual architecture · not a claim of deployed infrastructure</text><text x="862" y="285" fill="#67e8f9" font-size="12" text-anchor="end">PYTHON / IOT / DATA QUALITY</text></g></svg>